version: '3.9'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: genesis
      POSTGRES_PASSWORD: genesis
      POSTGRES_DB: genesis
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/dockerfiles/Dockerfile.api
    environment:
      GENESIS_ENVIRONMENT: local
      GENESIS_DATABASE_URL: postgresql://genesis:genesis@postgres:5432/genesis
      GENESIS_REDIS_URL: redis://redis:6379/0
      GENESIS_API_KEY_ID: local-admin
      GENESIS_API_KEY_SECRET: local-secret
      GENESIS_API_KEY_ROLES: viewer,operator,governor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health/ready", "-H", "Authorization: Bearer local-admin:local-secret"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: infra/dockerfiles/Dockerfile.worker
    environment:
      GENESIS_ENVIRONMENT: local
      GENESIS_DATABASE_URL: postgresql://genesis:genesis@postgres:5432/genesis
      GENESIS_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/genesis.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
