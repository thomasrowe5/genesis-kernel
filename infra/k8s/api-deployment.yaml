apiVersion: apps/v1
kind: Deployment
metadata:
  name: genesis-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: genesis-api
  template:
    metadata:
      labels:
        app: genesis-api
    spec:
      containers:
        - name: api
          image: genesis/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: GENESIS_ENVIRONMENT
              value: staging
            - name: GENESIS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: genesis-secrets
                  key: database_url
            - name: GENESIS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: genesis-secrets
                  key: redis_url
            - name: GENESIS_API_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: genesis-secrets
                  key: api_key_id
            - name: GENESIS_API_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: genesis-secrets
                  key: api_key_secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: genesis-api
spec:
  selector:
    app: genesis-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
