    "redis (>=6.4.0,<7.0.0)",
    "aioredis (>=2.0.1,<3.0.0)",
    "prometheus-client (>=0.23.1,<0.24.0)",
    "prometheus-fastapi-instrumentator (>=7.1.0,<8.0.0)",
    "pydantic (>=2.12.3,<3.0.0)",
    "typer (>=0.19.2,<0.20.0)",
    "httpx (>=0.27.0,<0.28.0)",
    "bcrypt (>=4.1.3,<5.0.0)",
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-asyncio (>=1.2.0,<2.0.0)",
    "mypy (>=1.18.2,<2.0.0)",
