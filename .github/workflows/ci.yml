name: Genesis CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi
      - name: Ruff
        run: poetry run ruff check .
      - name: Mypy
        run: poetry run mypy --strict src
      - name: Tests
        run: poetry run pytest --cov=src/genesis --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Build Docker images
        run: |
          docker build -f infra/dockerfiles/Dockerfile.api -t genesis/api:ci .
          docker build -f infra/dockerfiles/Dockerfile.worker -t genesis/worker:ci .
      - name: Compose staging deployment
        run: |
          docker compose -f infra/docker-compose.yaml up --build -d
          docker compose -f infra/docker-compose.yaml ps
        env:
          GENESIS_ALLOW_UNSIGNED: 1
      - name: Docs build
        run: poetry run genesis docs build --output site
      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site
      - name: Benchmarks
        run: poetry run genesis benchmark run --output benchmarks/ci.json
      - name: Upload benchmarks
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: benchmarks
